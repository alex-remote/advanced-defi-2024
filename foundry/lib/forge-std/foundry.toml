[profile.default]
fs_permissions = [{ access = "read-write", path = "./"}]

[rpc_endpoints]
# 这些 RPC URL 是默认值的修改版本，用于测试初始化。
mainnet = "https://eth-mainnet.alchemyapi.io/v2/WV407BEiBmjNJfKo9Uo_55u0z0ITyCOX" # 不同的 API key。
optimism_goerli = "https://goerli.optimism.io/" # 添加了末尾斜杠。
arbitrum_one_goerli = "https://goerli-rollup.arbitrum.io/rpc/" # 添加了末尾斜杠。
needs_undefined_env_var = "${UNDEFINED_RPC_URL_PLACEHOLDER}"

[fmt]
# 以下全部是 `forge fmt` 的默认值。
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = 'long'
multiline_func_header = 'attributes_first'
quote_style = 'double'
number_underscore = 'preserve'
single_line_statement_blocks = 'preserve'
ignore = ["src/console.sol", "src/console2.sol"]